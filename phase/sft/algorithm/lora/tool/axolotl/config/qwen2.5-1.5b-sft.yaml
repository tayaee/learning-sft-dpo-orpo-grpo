# =====================================================================
# SFT demo config for Qwen2.5-1.5B-Instruct on Korean reasoning data
# =====================================================================
# Stage 1: SFT (LoRA) on 50k Korean CoT reasoning (amphora/korean-reasoning-small)
# Hardware: NVIDIA GB10 (Blackwell sm_120), 1 GPU, 128 GB unified memory
# Why Qwen2.5-1.5B: small, fast, good Korean+math; already cached locally
# Why LoRA:      1.5B fits in fp16, LoRA trims VRAM, fast iteration
# Why sdpa:      flash-attn 2.8.3 does not yet build for sm_120 (Blackwell)
# =====================================================================

base_model: Qwen/Qwen2.5-1.5B-Instruct
model_type: Qwen2ForCausalLM
tokenizer_type: AutoTokenizer

# ----- precision -----
bf16: true
tf32: true
flash_attention: false        # sm_120 빌드 실패 → SDPA fallback

# ----- dataset -----
datasets:
  - path: .
    data_files: train.jsonl
    type: chat_template
    chat_template: chatml
    field_messages: messages

val_set_size: 0.005           # 50k → 250 val rows
dataset_prepared_path: ./data/sft-full-out/dataset_prepared

# ----- context -----
sequence_len: 1024
sample_packing: true
pad_to_sequence_len: true

# ----- LoRA -----
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_modules_to_save: []

# Merge LoRA into base on save so we can load it like a vanilla HF model
# (this is the OUTPUT dir for `axolotl merge-lora` run after training; do NOT set
# `lora_model_dir` here during training — that field is for resuming from an
# already-saved PEFT adapter and would cause axolotl to try loading it at start.)

# ----- output -----
output_dir: ./data/sft-full-out/adapter

# ----- training -----
num_epochs: 1
micro_batch_size: 4
gradient_accumulation_steps: 8       # effective batch = 32
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
optimizer: adamw_torch
logging_steps: 10
save_total_limit: 2
evals_per_epoch: 0
saves_per_epoch: 1

# ----- memory -----
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# ----- Liger (faster kernels, fused CE) -----
plugins:
  - axolotl.integrations.liger.LigerPlugin
liger_rope: true
liger_rms_norm: true
liger_swiglu: true
liger_fused_linear_cross_entropy: true

# ----- logging -----
wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:
hub_model_id:
