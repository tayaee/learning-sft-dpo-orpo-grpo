# =====================================================================
# DPO (RL) SMOKE TEST config for Qwen2.5-1.5B-Instruct
# =====================================================================
# 목적: 파이프라인 점검용. 선호 쌓 50개(sample_rl-dpo) + max_steps 3 → 수분 내 완주.
#   - 데이터: data/train_rl-dpo-smoke.jsonl (rl-dpo-01-make-rl-dpo-data.sh smoke)
#   - 시작점: SFT merge 모델 (real 과 동일 — SFT 가 먼저 필요)
#   - 출력은 outputs/qwen2.5-1.5b-rl-dpo-smoke 로 분리
#
# 검증 포인트:
#   ① {prompt, chosen, rejected} 로드 정상  ② rewards/margins 로그
#   ③ 어댑터 저장  ④ merge-lora 성공
# =====================================================================

base_model: ./data/sft-mini-out/merged
model_type: Qwen2ForCausalLM
tokenizer_type: AutoTokenizer

# ----- precision -----
bf16: true
tf32: true
flash_attention: false

# ----- DPO settings -----
rl: dpo
dpo_beta: 0.1
dpo_loss_type: [sigmoid]
dpo_label_smoothing: 0.0
dpo_max_prompt_len: 768
dpo_max_length: 1024

# ----- reference model -----
ref_model: Qwen/Qwen2.5-1.5B-Instruct

# ----- dataset -----
datasets:
  - path: data/dpo-mini-in/train_rl-dpo.jsonl   # mini 전용 (symlink → out)
    type: passthrough

val_set_size: 0.0
dataset_prepared_path: ./data/dpo-mini-out/dataset_prepared

# ----- context -----
sequence_len: 1024
pad_to_sequence_len: true

# ----- LoRA -----
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# ----- output -----
output_dir: ./data/dpo-mini-out/adapter

# ----- training -----
max_steps: 3                           # smoke: 3 step 만 돌고 종료
micro_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_steps: 1
weight_decay: 0.0
optimizer: adamw_torch
logging_steps: 1
save_steps: 3
save_total_limit: 1
evals_per_epoch: 0

# ----- memory -----
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# ----- Liger -----
plugins:
  - axolotl.integrations.liger.LigerPlugin

# ----- logging -----
wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:
hub_model_id:
